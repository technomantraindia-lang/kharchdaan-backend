services:
  - type: web
    name: kharchdaan-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: KharchDaan
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://kharchdaan-backend.onrender.com
      - key: DB_CONNECTION
        value: sqlite
      # Client: 100% referral income
      - key: MLM_REFERRAL_RATE
        value: "1.00"
      # Set these only in Render Dashboard (never commit secrets).
      # After any chat paste of live keys: regenerate in Razorpay, then update here.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
