<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="300" height="300" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative pattern -->
  <circle cx="150" cy="150" r="90" fill="#ffffff" opacity="0.6"/>
  <circle cx="150" cy="150" r="65" fill="#f1f5f9" opacity="0.8"/>

  <!-- Grocery / Food Package Icon -->
  <g filter="url(#shadow)" transform="translate(100, 95)">
    <!-- Shopping Bag Body -->
    <path d="M15 35 C15 30, 20 25, 28 25 L72 25 C80 25, 85 30, 85 35 L93 90 C94 98, 88 105, 80 105 L20 105 C12 105, 6 98, 7 90 Z" fill="url(#iconGrad)"/>
    
    <!-- Bag Handle -->
    <path d="M34 25 C34 10, 66 10, 66 25" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Leaves / Fresh Badge -->
    <path d="M50 45 C40 55, 30 50, 32 40 C42 30, 52 35, 50 45 Z" fill="#22c55e" opacity="0.9"/>
    <path d="M50 45 C60 55, 70 50, 68 40 C58 30, 48 35, 50 45 Z" fill="#16a34a" opacity="0.9"/>
  </g>
  
  <text x="150" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#64748b" text-anchor="middle">Product Image</text>
</svg>
